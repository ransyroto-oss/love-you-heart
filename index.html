<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A glowing blue heart made of love, just for you."
    />
    <meta name="theme-color" content="#000000" />
    <title>Love You Heart</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="love-scene" aria-label="An animated love message">
      <canvas class="heart-sky" aria-hidden="true"></canvas>
      <div class="sky-vignette" aria-hidden="true"></div>

      <header class="scene-note" aria-hidden="true">
        <span class="note-rule"></span>
        <p>A little light, just for you</p>
        <span class="note-rule"></span>
      </header>

      <div class="center-copy">
        <p class="center-message">Love You</p>
      </div>

      <footer class="scene-signoff" aria-hidden="true">
        <span class="signoff-star"></span>
        <p>In every quiet moment</p>
        <span class="signoff-star"></span>
      </footer>
    </main>
  </body>
</html>
